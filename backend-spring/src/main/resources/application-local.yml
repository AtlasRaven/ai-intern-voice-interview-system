server:
  port: ${PORT:8088}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: interview-backend-local

  datasource:
    url: jdbc:h2:file:./data/intern_interview;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  flyway:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1qd3Qtc2VjcmV0LWtleS1mb3Itdm9pY2UtaW50ZXJ2aWV3LXN5c3RlbS0yMDI2LXZpZXRuYW0=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  internal:
    service-key: ${INTERNAL_SERVICE_KEY:intern-voice-gateway-internal-secret-token-key-2026}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
