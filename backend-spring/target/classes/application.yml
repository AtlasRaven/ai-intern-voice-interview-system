server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: interview-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/intern_interview}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1qd3Qtc2VjcmV0LWtleS1mb3Itdm9pY2UtaW50ZXJ2aWV3LXN5c3RlbS0yMDI2LXZpZXRuYW0=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  internal:
    service-key: ${INTERNAL_SERVICE_KEY:intern-voice-gateway-internal-secret-token-key-2026}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
